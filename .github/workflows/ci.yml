name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest==8.4.2 ruff==0.17.1
      - run: ruff check stagesight aws scripts tests
      - run: pytest -q -m "research or not research"
